name: Windows artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build, audit, and package
        shell: powershell
        run: ./scripts/build-windows.ps1

      - name: Upload portable and installer
        uses: actions/upload-artifact@v4
        with:
          name: visor-${{ github.ref_name }}-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
