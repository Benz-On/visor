name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs additionally exercise the Windows and macOS native jobs. The
  # paid hosted runners stay out of the automatic path to conserve Actions
  # quota; the automatic gate below runs on Linux only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Workflow preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native-os: ${{ steps.select-os.outputs.list }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify immutable action references
        run: node scripts/check-workflow-pins.mjs

      - name: Select native runners
        id: select-os
        # A job-level `if` has no `matrix` context, so the runner set is decided
        # here instead: automatic events pay for Linux only, and a manual dispatch
        # adds the Windows and macOS legs.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'list=["ubuntu-24.04","windows-latest","macos-14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          fi

  frontend-and-agent:
    name: Frontend and agent
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test agent logic
        run: npm run test:agent

      - name: Build web application
        run: npm run build

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

  native:
    name: Native tests · ${{ matrix.os }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.preflight.outputs.native-os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint native code
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file src-tauri/Cargo.lock
