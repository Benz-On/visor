[package]
name = "visor"
version = "0.9.1-beta.1"
description = "VISOR premium local system monitor"
authors = ["Benz Engineering"]
edition = "2021"
rust-version = "1.77.2"
repository = "https://github.com/Benz-On/visor"
homepage = "https://github.com/Benz-On/visor"
readme = "../README.md"
keywords = ["system-monitor", "local-ai", "tauri", "telemetry"]
categories = ["gui"]
publish = false

[lib]
name = "visor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tauri = { version = "=2.8.5", features = [] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
wait-timeout = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
