[package]
name = "visor"
version = "0.4.0-alpha.2"
description = "VISOR premium local system monitor"
authors = ["Benz Engineering"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "visor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tauri = { version = "=2.8.5", features = [] }
ureq = { version = "2.12", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
